name: "Deploy to S3"
description: "Deploys a website to an S3 bucket"
inputs:
  bucket:
    description: "The name of the S3 bucket to deploy to"
    required: true
  bucket-region:
    description: "The region of the S3 bucket"
    required: false
    default: "us-east-1"
  dist-folder:
    description: "The folder containing the files to deploy"
    required: true
runs:
  using: "node24"
  main: "main.js"
